server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: secure-chat-server
  datasource:
    url: jdbc:h2:mem:securechat_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:v9y$B&E)H@McQfTjWnZr4u7x!A%D*F-JaNdRgUkXp2s5v8y/B?E(H+MbQeShVmYq}
    expiration-ms: 86400000 # 24 hours
  crypto:
    kem-algorithm: ML-KEM-768
    dsa-algorithm: ML-DSA-65
